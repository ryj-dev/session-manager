name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: builds the app and uploads to a DRAFT release, so the whole
  # pipeline can be exercised without publishing anything. Delete the draft after.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run dist:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-dryrun-{0}', github.run_id) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('CI dry run {0}', github.run_id) }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
